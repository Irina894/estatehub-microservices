syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Reviews.Grpc";

package reviews;

// Читання відгуків для внутрішніх сервісів (Aggregator). Запис лишається в REST API.
service ReviewsService {
  // Один відгук за ObjectId. NotFound, якщо його немає; InvalidArgument для некоректного id.
  rpc GetReview (GetReviewRequest) returns (ReviewReply);

  // Відгуки на об'єкт (productId) з пагінацією, найновіші першими.
  rpc GetReviewsByProduct (GetReviewsByProductRequest) returns (ReviewsReply);
}

message GetReviewRequest {
  string id = 1;                    // MongoDB ObjectId (24 hex-символи)
}

message GetReviewsByProductRequest {
  int64 product_id = 1;
  int32 page = 2;                   // 0 = 1
  int32 page_size = 3;              // 0 = 20, максимум 100
}

message ReviewReply {
  string id = 1;
  int64 product_id = 2;
  string product_name = 3;
  string author_name = 4;
  int32 rating = 5;
  string text = 6;
  int32 comments_count = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ReviewsReply {
  repeated ReviewReply reviews = 1;
  int64 total_count = 2;
}
