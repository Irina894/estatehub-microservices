// Стандартний gRPC Health Checking Protocol (https://github.com/grpc/grpc/blob/master/doc/health-checking.md).
// Aggregator - лише КЛІЄНТ: викликає Health/Check у Deals, Catalog, Reviews (сервери - Grpc.AspNetCore.HealthChecks).
syntax = "proto3";

package grpc.health.v1;

option csharp_namespace = "Grpc.Health.V1";

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;  // використовується лише Watch
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
